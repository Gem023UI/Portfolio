<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/LOGO.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/solid/rounded.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/brands/all.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jemuel Malaga | Product Designer & Full Stack Developer</title>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jm-portfolio-theme-mode');
          var h = new Date().getHours();
          var byClock = h >= 5 && h < 17 ? 'morning' : h >= 17 && h < 19 ? 'sunset' : 'night';
          var ok = stored === 'morning' || stored === 'sunset' || stored === 'night';
          document.documentElement.setAttribute('data-theme', ok ? stored : byClock);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'morning');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
